name: Robust Android APK Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-Scaffold Clean Android Structure
        run: |
          # 1. Standard directories create karein
          mkdir -p app/src/main/java/com/example/expense
          mkdir -p app/src/main/res/values

          # 2. gradle.properties (AndroidX enable karna zaroori hai)
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 3. Settings.gradle define karein
          cat << 'EOF' > settings.gradle
          rootProject.name = "ExpenseManager"
          include ':app'
          EOF

          # 4. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 5. App-level build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.example.expense'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.expense"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 6. Required dummy resources (AAPT2 crash rokne ke liye)
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Vault Flow</string>
          </resources>
          EOF

          # 7. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 8. Check agar MainActivity exist karti hai toh sahi jagah move karo
          if [ -f "src/main/java/com/example/expense/MainActivity.java" ]; then
              cp src/main/java/com/example/expense/MainActivity.java app/src/main/java/com/example/expense/
          elif [ -f "MainActivity.java" ]; then
              cp MainActivity.java app/src/main/java/com/example/expense/
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile and Assemble APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseManager-APK
          path: app/build/outputs/apk/debug/*.apk
